<script>
var B=JSON.parse(document.getElementById('blob').textContent);
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function keyFrom(pw){
  var kb=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.salt),iterations:B.iter,hash:'SHA-256'},kb,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function dec(pw){
  var k=await keyFrom(pw);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.iv)},k,b64(B.ct));
  return new TextDecoder().decode(pt);
}
// 같은 기기에서 다시 묻지 않기: localStorage + IndexedDB 두 곳에 기억, 열 때마다 다시 저장 (2026-10-17 운영자 글로벌 요청)
var GKEY='sai_gate_pw';
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('gate',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
async function idbDo(mode,fn){try{var db=await idb();return await new Promise(function(res){var t=db.transaction('kv',mode),q=fn(t.objectStore('kv'));t.oncomplete=function(){res(q&&q.result)};t.onerror=t.onabort=function(){res(null)}})}catch(e){return null}}
async function remember(pw){try{localStorage.setItem(GKEY,pw)}catch(e){}await idbDo('readwrite',function(s){return s.put(pw,GKEY)});try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
async function recall(){var s=null;try{s=localStorage.getItem(GKEY)}catch(e){}return s||await idbDo('readonly',function(s){return s.get(GKEY)})}
async function forget(){try{localStorage.removeItem(GKEY)}catch(e){}await idbDo('readwrite',function(s){return s.delete(GKEY)})}
async function openDoc(pw,save){
  var html=await dec(pw);
  await remember(pw);
  document.open();document.write(html);document.close();
}
document.getElementById('go').onclick=async function(){
  try{await openDoc(document.getElementById('pw').value,true);}
  catch(e){document.getElementById('err').textContent='비밀번호가 올바르지 않습니다.';}
};
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('go').click();});
// 저장된 비밀번호가 있으면 자동 복호화 — 이때 비밀번호 입력 화면 대신 '불러오는 중'을 보여줘 깜빡임을 없앤다.
(async function(){var s=await recall();
  if(s){ var gl=document.getElementById('gload'); if(gl)gl.style.display='';   // 로딩만 표시(비번 박스 아예 미표시)
    try{await openDoc(s,false);}catch(e){await forget();location.reload();} }
  else{ var gb=document.getElementById('gbox'); if(gb)gb.style.display=''; var p=document.getElementById('pw'); if(p)p.focus(); }  // 저장 비번 없을 때만 입력창
})();
</script></body></html>
